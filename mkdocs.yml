site_name: QA Knowledge - 他社QA事例・ナレッジ集
site_description: テック企業のQA事例・ナレッジを構造化して収集するリポジトリ
repo_name: qa-knowledge
docs_dir: .site-docs
hooks:
  - scripts/mkdocs_hooks.py
watch:
  - index.md
  - indexes
  - entries
  - docs

theme:
  name: material
  language: ja
  palette:
    - scheme: default
      primary: teal
      accent: green
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替え
    - scheme: slate
      primary: teal
      accent: green
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替え
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: ja
  - tags

nav:
  - ホーム: index.md
  - エントリ一覧:
      - 会社別: indexes/by-company.md
      - QA領域別: indexes/by-domain.md
      - タグ別: indexes/by-tag.md
      - 追加日順: indexes/by-date.md
  - ガイド:
      - リグレッションテスト全自動化: docs/regression-test-automation-guide.md
  - 読書レポート:
      - 知識ゼロから学ぶソフトウェアテスト: docs/book-report-software-testing-basics.md
      - ソフトウェアテスト技法ドリル: docs/book-report-test-technique-drill.md
  - スキーマ定義: docs/schema.md

# 下書きは公開用入力へ複製しない。将来のdocs_dir変更にも備えて除外する。
exclude_docs: |
  drafts/
