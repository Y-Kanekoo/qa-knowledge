name: コード品質チェック

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 依存パッケージのインストール
        run: pip install -r requirements.txt pytest-cov
      - name: Ruff によるコード品質チェック
        run: ruff check .
      - name: Pytest によるテスト実行
        run: pytest -v --tb=short --cov=scripts --cov-report=term-missing
      - name: インデックスを最新化
        run: python scripts/generate_index.py
      - name: MkDocs の厳密ビルド検証
        run: mkdocs build --strict
