name: 新着QA記事チェック（日次）

on:
  schedule:
    - cron: "0 0 * * *"  # 毎日 00:00 UTC（JST 09:00）
  workflow_dispatch: {}   # 手動実行も可能

jobs:
  check-rss:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 依存パッケージのインストール
        run: pip install feedparser pyyaml python-frontmatter requests
      - name: RSSフィードの巡回
        id: rss
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          NOTIFY_FLAG=""
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            NOTIFY_FLAG="--notify discord"
          fi
          status=0
          python scripts/check_rss.py --days 365 --format markdown --github-output "$GITHUB_OUTPUT" $NOTIFY_FLAG > rss_result.txt || status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
      - name: 新着記事をIssueで通知
        if: steps.rss.outputs.has_new_articles == 'true'
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: "[new-article] 新着QA関連記事が見つかりました"
          content-filepath: rss_result.txt
          labels: new-article
      - name: RSS実行結果の確認
        if: always() && steps.rss.outputs.exit_code != '0'
        run: exit 1
