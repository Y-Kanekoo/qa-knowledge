name: QA記事自動収集（日次）

on:
  schedule:
    - cron: "30 0 * * *"  # 毎日00:30 UTC（JST 09:30）
  workflow_dispatch: {}

concurrency:
  group: collect-articles
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 依存パッケージのインストール
        run: pip install -r requirements.txt

      - name: 既存収集PRの下書きを保持
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 開いている収集PRだけを継続。マージ・却下済みの下書きは復活させない。
          pending=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head auto/collect-articles --json number --jq length)
          if [ "$pending" != 0 ]; then
            git fetch --depth=1 origin auto/collect-articles
            python scripts/collect_articles.py --restore-ref FETCH_HEAD
          fi

      - name: RSS新着記事の検出
        run: python scripts/check_rss.py --days 3 --format json --allow-partial-feeds > "$RUNNER_TEMP/rss_articles.json"

      - name: 下書きを保存
        id: collect
        run: python scripts/collect_articles.py --input "$RUNNER_TEMP/rss_articles.json" --github-output "$GITHUB_OUTPUT"

      - name: 下書きと既存公開記事を別々に検証
        run: |
          python scripts/validate_drafts.py
          python scripts/validate_frontmatter.py

      - name: 下書きPRを作成・更新
        if: steps.collect.outputs.has_changes == 'true' && steps.collect.outputs.added_count != '0'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "[feat] QA記事の下書きを保存する"
          title: "[auto] QA記事の下書き（要補完）"
          body: |
            ## 収集した下書き

            RSSの直近3日分（UTCの3日前以降、境界日を含む）を対象に収集しています。
            日付不明の記事は下書きに残します。Issue通知の365日分とは対象期間が異なります。

            - 今回新たに保存した下書き: ${{ steps.collect.outputs.added_count }}件
            - 公開記事追加: 0件（`drafts/` は公開索引に含めません）
            - 既存PR上の補完中の下書きは保持します

            下書きのままマージして保存できます。内容を補完し、`python scripts/promote_draft.py drafts/<file>.md` で
            公開記事の必須項目・本文を検証して `entries/` に移してください。
            続いて `python scripts/validate_frontmatter.py` と `python scripts/generate_index.py` を実行してください。
          branch: auto/collect-articles
          base: main
          add-paths: drafts/*.md
